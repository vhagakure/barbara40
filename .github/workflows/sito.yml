name: Pubblica il sito

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/**
      - worker/**
      - drizzle/**
      - scripts/build.mjs
      - scripts/configure-cloudflare.mjs
      - package.json
      - package-lock.json
      - .github/workflows/sito.yml

permissions:
  contents: read

concurrency:
  group: barbara-sito
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOSTING_TARGET: cloudflare
      CONTACT_URL: ${{ secrets.CONTACT_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_D1_NAME: ${{ vars.CF_D1_NAME }}
      CF_D1_ID: ${{ vars.CF_D1_ID }}
      CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/configure-cloudflare.mjs
      - run: npx --no-install wrangler d1 migrations apply DB --remote --config .wrangler.deploy.json
      - run: npx --no-install wrangler deploy --config .wrangler.deploy.json
